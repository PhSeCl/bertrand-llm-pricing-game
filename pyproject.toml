[project]
name = "bertrand-llm-pricing-game"
version = "0.1.0"
description = "大模型 API 厂商的差异化 Bertrand 价格博弈仿真（博弈论课程团队作业）"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Game Theory Course Team" },
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bertrand_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# dev 依赖通过 `uv sync --extra dev` 安装
